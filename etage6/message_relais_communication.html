<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Message urgent</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background-color: #0A1F44;
}

.messageDiagnostic {
    width: 512px;
    height: 256px;
    box-sizing: border-box;
    border: 3px solid #FF2BD6;
    background-color: #07152b;
    color: #E6F7FF;
    padding: 12px;
    font-family: Arial, sans-serif;
}

.titreCadre {
    white-space: pre;
    color: #FF2BD6;
    font-family: Consolas, "Courier New", monospace;
    font-size: 18px;
    text-align: center;
    margin-bottom: 16px;
}

.highlight {
    font-weight: 900;
    color: #FFD700;
    font-size: 20px;
}

.message {
    font-family: "Segoe Print", "Segoe Script", cursive;
    font-size: 18px;
    line-height: 1.5;
}

.message a {
    font-family: Arial, sans-serif;
    color: #00E5FF;
}

</style>

</head>

<body>

<div class="messageDiagnostic">

<div class="titreCadre">
| MESSAGE URGENT DU <span class="highlight">RELAIS DE COMMUNICATION</span> |
</div>

<p class="message">
« Chef, nous sommes coincés. Nous avons besoin d’aide. Ce document devrait pouvoir nous tirer de là :
<a href="https://docs.oracle.com/javase/specs/jls/se17/html/jls-3.html#jls-3.3">
https://docs.oracle.com/javase/specs/jls/se17/html/jls-3.html#jls-3.3
</a> »
</p>

</div>

</body>
</html>
