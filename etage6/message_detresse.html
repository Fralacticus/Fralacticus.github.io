<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Piano Partition</title>

<style>

body{
    margin:0;
}

/* fond clavier */
.piano-bg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
        repeating-linear-gradient(
            to right,
            #f4f1e2 0px,
            #f4f1e2 60px,
            #e2decf 60px,
            #e2decf 62px
        );
}

/* touches noires */
.piano-bg::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:120px;

    background:
        linear-gradient(to right, transparent 40px, #111 40px, #111 70px, transparent 70px),
        linear-gradient(to right, transparent 100px, #111 100px, #111 130px, transparent 130px),
        linear-gradient(to right, transparent 220px, #111 220px, #111 250px, transparent 250px),
        linear-gradient(to right, transparent 280px, #111 280px, #111 310px, transparent 310px),
        linear-gradient(to right, transparent 340px, #111 340px, #111 370px, transparent 370px);

    background-size:420px 120px;
    background-repeat:repeat-x;
}

/* zone 512x256 avec bordure */
#container{
    position:relative;
    width:512px;
    height:256px;
    border:4px solid black;
    box-sizing:border-box;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* feuille de partition */
.sheet{
    width:220px;
    height:160px;
    background:#fffdf6;
    border:2px solid #444;
    box-shadow:0 0 12px rgba(0,0,0,0.35);
    position:relative;

    transform: rotate(12deg);
}

/* lignes de partition */
.sheet::before{
    content:"";
    position:absolute;
    left:15px;
    right:15px;
    top:40px;
    height:2px;
    background:black;
    box-shadow:
        0 12px 0 black,
        0 24px 0 black,
        0 36px 0 black,
        0 48px 0 black;
}

.sheet a{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;

    text-decoration: underline;
    font-weight:bold;
    color:black;

    transition: all 0.2s ease;
}

.sheet a:hover{
    color:#b00000;
    text-shadow: 0 0 4px rgba(0,0,0,0.3);
}

.sheet a:hover{
    text-decoration: underline;
}

</style>
</head>

<body>

<div class="piano-bg"></div>

<div id="container">
    <div class="sheet">
        <a href="partition_message_detresse.txt">Partition</a>
    </div>
</div>

</body>
</html>
